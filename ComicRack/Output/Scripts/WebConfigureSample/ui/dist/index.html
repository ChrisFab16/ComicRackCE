<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Web Configure Sample</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main>
    <h1>Web Configure Sample</h1>
    <p class="meta" id="hostInfo">Connecting to host…</p>
    <label>
      Note (persisted via host.config)
      <textarea id="note" rows="4" placeholder="Type a note and Save"></textarea>
    </label>
    <div class="actions">
      <button type="button" id="btnSave">Save</button>
      <button type="button" id="btnReload">Reload UI</button>
      <button type="button" id="btnClose">Close</button>
    </div>
    <h2>Books</h2>
    <ul id="books"></ul>
  </main>
  <script src="./host-bridge.js"></script>
  <script src="./app.js"></script>
</body>
</html>
